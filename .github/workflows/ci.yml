name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Bağımlılıkları kur
        run: python -m pip install -e ".[dev]"
      - name: Ruff (lint)
        run: python -m ruff check .
      - name: Ruff (biçim)
        run: python -m ruff format --check .
      - name: Testler
        run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Exe oluştur
        run: python -m PyInstaller --noconfirm CeyrekTakip.spec
      - uses: actions/upload-artifact@v7
        with:
          name: CeyrekTakip-exe
          path: dist/CeyrekTakip.exe
          retention-days: 14
